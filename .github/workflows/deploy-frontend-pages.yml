name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - '.github/workflows/deploy-frontend-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'github-pages'
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: npm --prefix client ci

      - name: Build Vite Application
        env:
          # If your repository is https://username.github.io/Visa, base is /Visa/
          # If you attach a custom domain (e.g. visaprep.com), set VITE_BASE_PATH: / in repo variables
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || format('/{0}/', github.event.repository.name) }}
          VITE_API_URL: ${{ secrets.VITE_API_URL || vars.VITE_API_URL || 'http://3.110.156.76/api' }}
        run: npm --prefix client run build

      - name: Enable SPA Routing for GitHub Pages (404 Fallback)
        # GitHub Pages serves 404.html for direct subroute navigation (/questions, /checkout, etc.)
        # Copying index.html to 404.html ensures the React Router handles all subroutes smoothly
        run: cp client/dist/index.html client/dist/404.html

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
