AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Visa OA Preparation Platform - Serverless Backend, DynamoDB Tables, and S3/CloudFront Distribution

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment environment name

  JwtSecret:
    Type: String
    NoEcho: true
    Description: Secret key used to sign and verify JWT authentication tokens

  UpiId:
    Type: String
    Default: visaprep@okaxis
    Description: UPI ID for manual student payment transfers

  UpiPayeeName:
    Type: String
    Default: Visa OA Prep Platform
    Description: Name of recipient displayed to students during payment

Globals:
  Function:
    Timeout: 15
    MemorySize: 512
    Runtime: nodejs20.x
    Architectures:
      - arm64 # Cost-effective Graviton2 processor

Resources:
  ##############################################################################
  # DynamoDB Tables (On-Demand Capacity for Cost Optimization)
  ##############################################################################

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'VisaPrep_Users_${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  QuestionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'VisaPrep_Questions_${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  PaymentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'VisaPrep_Payments_${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: submittedAt
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: UserPaymentsIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: submittedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: StatusPaymentsIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: submittedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ProgressTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'VisaPrep_Progress_${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  ##############################################################################
  # Backend API: Lambda Function & HTTP API Gateway
  ##############################################################################

  ApiGatewayApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - Cookie
        AllowCredentials: true

  ExpressApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../server/
      Handler: lambda.handler
      Description: Express API backend wrapped with serverless-http
      Environment:
        Variables:
          NODE_ENV: production
          USERS_TABLE: !Ref UsersTable
          QUESTIONS_TABLE: !Ref QuestionsTable
          PAYMENTS_TABLE: !Ref PaymentsTable
          PROGRESS_TABLE: !Ref ProgressTable
          JWT_SECRET: !Ref JwtSecret
          UPI_ID: !Ref UpiId
          UPI_PAYEE_NAME: !Ref UpiPayeeName
          UPI_AMOUNT_INR: '20'
          USE_LOCAL_MOCK: 'false'
      Policies:
        # Least privilege DynamoDB access scoped to the application tables
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref QuestionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PaymentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ProgressTable
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGatewayApi
            Path: /{proxy+}
            Method: ANY

  ExpressApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ExpressApiFunction}'
      RetentionInDays: 30

  ##############################################################################
  # Frontend Hosting: S3 Bucket & CloudFront CDN
  ##############################################################################

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'visaprep-frontend-${AWS::AccountId}-${Environment}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'visaprep-frontend-oac-${Environment}'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100 # Low cost: US, Canada, Europe, Asia
        Origins:
          - Id: S3FrontendOrigin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOriginAccessControl.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: S3FrontendOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          Compress: true
        CustomErrorResponses:
          # SPA routing support: return index.html on 404/403
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Action: 's3:GetObject'
            Effect: Allow
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Principal:
              Service: cloudfront.amazonaws.com
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'

Outputs:
  ApiEndpoint:
    Description: Base HTTP API Gateway URL
    Value: !Sub 'https://${ApiGatewayApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'

  CloudFrontUrl:
    Description: Frontend CloudFront CDN Domain URL
    Value: !Sub 'https://${FrontendDistribution.DomainName}'

  FrontendBucketName:
    Description: S3 Bucket Name for Frontend Assets
    Value: !Ref FrontendBucket
